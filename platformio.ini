; nRF24 Analyser firmware - PlatformIO project
;
; Target: USB dongle with ATmega328P + CH340 + nRF24L01. The CH340 exposes a
; serial bootloader, so the dongle is flashed over USB like an Arduino Nano.
; CH340 clones ship with one of two bootloaders - if `nano` fails to upload
; with an avrdude sync timeout, use the `nano_old` environment instead.
;
;   pio run -e nano -t upload          # default (new bootloader, 115200)
;   pio run -e nano_old -t upload      # fallback (old bootloader, 57600)
;   pio device monitor -e nano         # open serial monitor @ 115200

[env]
platform = atmelavr
framework = arduino
monitor_speed = 500000
; The firmware does not echo input, so let the monitor show what is typed.
monitor_echo = yes
monitor_eol = LF
; A 256-byte serial TX buffer keeps Serial.print() from blocking on every line,
; so the 3-deep nRF24 RX FIFO gets drained instead of overflowing during bursts.
build_flags =
    -DSERIAL_TX_BUFFER_SIZE=256
lib_deps =
    nrf24/RF24@^1.4.11

[env:nano]
board = nanoatmega328new
upload_port = COM18
monitor_port = COM18

[env:nano_old]
board = nanoatmega328
upload_port = COM18
monitor_port = COM18
